name: Scan graduate schemes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graduate-scheme-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run scan:github
        working-directory: worker
      - name: Publish changed results
        run: |
          git config user.name "GradScheme 2027 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/api/schemes
          git diff --cached --quiet || git commit -m "Update verified 2027 schemes"
          git push
